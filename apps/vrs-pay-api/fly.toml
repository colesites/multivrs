# Deploy from the repo root: fly deploy --config apps/vrs-pay-api/fly.toml
app = "vrs-pay-api"
# Paris, next to the Supabase pooler (eu-west-3).
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"
  ignorefile = "Dockerfile.dockerignore"

[deploy]
  # Runs on a temporary machine with the app's secrets before each release.
  release_command = "bun run db:migrate:deploy"

[env]
  PORT = "4300"

[http_service]
  internal_port = 4300
  force_https = true
  # The webhook and billing workers run in this process, so it never sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
