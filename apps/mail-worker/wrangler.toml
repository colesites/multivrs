name = "multivrs-mail"
main = "src/index.ts"
compatibility_date = "2026-07-27"

[[queues.producers]]
binding = "MAIL_QUEUE"
queue = "multivrs-mail-delivery"

[[queues.consumers]]
queue = "multivrs-mail-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "multivrs-mail-dead-letter"

[vars]
CONTROL_PLANE_URL = "https://multivrs.space"

[triggers]
crons = ["* * * * *"]
